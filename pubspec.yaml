name: wealth_tracker
description: A wealth tracking and investment app for Gold, Stocks, Liquidity, and Real Estate.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  signals_flutter: ^6.0.2

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Dependency Injection
  get_it: ^8.0.2

  # Network
  dio: ^5.7.0

  # Charts
  fl_chart: ^0.70.2

  # Auth
  local_auth: ^2.3.0
  flutter_screen_lock: ^9.1.0
  crypto: ^3.0.6

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
